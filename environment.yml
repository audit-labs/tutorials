# Conda convenience file. requirements.txt is what CI installs and is pinned;
# this list is loose and can drift from it. Prefer requirements.txt when the two
# disagree.
name: audit-tutorials
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pandas>=2.3.3
  - numpy>=1.26
  - matplotlib>=3.10
  - seaborn>=0.13
  - openpyxl
  - jupyterlab
  - ipykernel
  - nbconvert
  - nbclient
  - pip:
    - papermill